mode: single_lepton  # exactly one selected lepton (muon or electron)

hlt_by_era:
  UL16:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_IsoTkMu24_v*"
      - "HLT_Ele27_WPTight_Gsf_v*"
  UL17:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu27_v*"
      - "HLT_Ele32_WPTight_Gsf_L1DoubleEG_v*"
      - "HLT_Ele35_WPTight_Gsf_v*"
  UL18:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"
  Run3_22:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Mu50_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"
  Run3_22EE:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Mu50_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"
  Run3_23:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"
  Run3_23BPix:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"
  Run3_24:
    apply: true
    process: "HLT"
    paths:
      - "HLT_IsoMu24_v*"
      - "HLT_Ele32_WPTight_Gsf_v*"

jets:
  min_njets: 4
  max_njets: -1
  min_pt: 20.0
  max_eta: 2.5
  jet_id: "tight"  # "loose" | "tight" | "tightLepVeto" | "" (disable)
  jet_lepton_overlap_dr: -1.0

leptons:
  max_nleptons: -1
  muon_min_pt: 20.0
  muon_max_eta: 2.4
  muon_id: "none"
  muon_max_rel_iso04: -1.0
  electron_min_pt: 25.0
  electron_max_eta: 2.5
  electron_id: "none"
  electron_max_rel_iso03: -1.0
